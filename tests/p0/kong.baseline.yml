# Historical HTTP P0 fixture only. Never mount this in the main deployment.
_format_version: '3.0'
_transform: true
services:
  - name: fastapi-service
    url: http://backend:8000
    routes:
      - name: fastapi-route
        paths: [/health, /docs, /openapi.json, /api]
        strip_path: false
plugins:
  - name: rate-limiting
    config:
      minute: 60
      policy: local
