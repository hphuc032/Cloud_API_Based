x-app-environment: &app-environment
  APP_ENV: ${APP_ENV:-production}
  DEBUG: "false"
  APP_DB_NAME: ${APP_DB_NAME:-appdb}
  DB_HOST: postgres
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-["http://localhost:3000","http://localhost:5173"]}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
    labels: "com.docker.compose.service,com.docker.compose.project"

services:
  postgres:
    image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
    environment:
      POSTGRES_DB: ${APP_DB_NAME:-appdb}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [app_data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  db-bootstrap:
    build: ../backend
    command: [python, -m, deployment.bootstrap]
    environment:
      APP_DB_NAME: ${APP_DB_NAME:-appdb}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      MIGRATION_PASSWORD_FILE: /run/secrets/migration_password
      RUNTIME_PASSWORD_FILE: /run/secrets/runtime_password
    secrets: [postgres_password, migration_password, runtime_password]
    networks: [app_data]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *logging

  migrate:
    build: ../backend
    command: [python, -m, deployment.migrate]
    environment:
      <<: *app-environment
      DB_PASSWORD_FILE: /run/secrets/migration_password
    secrets: [migration_password]
    networks: [app_data]
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    restart: "no"
    logging: *logging

  backend:
    build: ../backend
    environment:
      <<: *app-environment
      DB_PASSWORD_FILE: /run/secrets/runtime_password
      SECRET_KEY_FILE: /run/secrets/jwt_secret
      WEBHOOK_SECRET_FILE: /run/secrets/webhook_secret
    secrets: [runtime_password, jwt_secret, webhook_secret]
    command: [python, -m, deployment.serve]
    volumes:
      - ${PKI_DIR:-./certs}/backend:/run/tls:ro
    networks: [api_transport, app_data]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -m, deployment.health]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging: *logging

  identity-db:
    image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/identity_admin_password
    secrets: [identity_admin_password]
    volumes: [identity_postgres_data:/var/lib/postgresql/data]
    networks: [identity_data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d keycloak']
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  identity-bootstrap:
    build: ../backend
    command: [python, -m, deployment.identity_bootstrap]
    environment:
      IDENTITY_ADMIN_PASSWORD_FILE: /run/secrets/identity_admin_password
      IDENTITY_DB_PASSWORD_FILE: /run/secrets/identity_db_password
    secrets: [identity_admin_password, identity_db_password]
    networks: [identity_data]
    depends_on:
      identity-db:
        condition: service_healthy
    restart: "no"
    logging: *logging

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1@sha256:a78d6b79572168cb25886b80a8b5b8d4ed4390743e3eecb810538683e209dd6b
    entrypoint: [/bin/bash, /opt/p3-entrypoint.sh]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_HEALTH_ENABLED: "true"
      KC_DB: postgres
      # Preserve pre-26.7 durability; keep the new, unused SCIM surface disabled.
      KC_SPI_CONNECTIONS_JPA__QUARKUS__ASYNC_COMMIT: 'false'
      KC_FEATURES_DISABLED: scim-api
      KC_DB_URL: jdbc:postgresql://identity-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_HOSTNAME: ${IDENTITY_HOSTNAME:?Set the stable HTTPS identity origin}
      KC_HOSTNAME_STRICT: "true"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "false"
      KC_HTTP_ENABLED: "false"
      KC_HTTPS_CERTIFICATE_FILE: /run/tls/server.pem
      KC_HTTPS_CERTIFICATE_KEY_FILE: /run/tls/server.key
      KC_HTTPS_PROTOCOLS: TLSv1.3,TLSv1.2
    secrets: [keycloak_admin_password, identity_db_password]
    volumes:
      - ./keycloak-entrypoint.sh:/opt/p3-entrypoint.sh:ro
      - ./keycloak/HealthProbe.java:/opt/HealthProbe.java:ro
      - ./keycloak/florasecure-realm.json:/opt/keycloak/data/import/florasecure-realm.json:ro
      - ${IDENTITY_TLS_DIR:?Supply identity TLS certificates}/keycloak:/run/tls:ro
    networks: [identity_transport, identity_data]
    depends_on:
      identity-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, java, /opt/HealthProbe.java]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    logging: *logging

  identity-edge:
    build: ./nginx
    volumes:
      - ./keycloak/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${IDENTITY_TLS_DIR:?Supply identity TLS certificates}/edge:/run/tls:ro
    ports: ['127.0.0.1:9443:8443']
    networks: [identity_transport]
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8081/ready]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  kong:
    image: kong:3.9.3@sha256:92035d16d7ff86b7bc12fb1d0090d29357d924238b1880f78735f3f2fea6b631
    # Preserve the established bind-mounted PKI owner despite the image UID change.
    user: '1000:1000'
    tmpfs:
      - /run/kong:uid=1000,gid=1000,mode=0750,size=256m
    environment:
      KONG_PREFIX: /run/kong
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /opt/kong/kong.yml
      KONG_ADMIN_LISTEN: 'off'
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_PROXY_LISTEN: '0.0.0.0:8443 ssl'
      KONG_SSL_CERT: /run/tls/edge.pem
      KONG_SSL_CERT_KEY: /run/tls/edge.key
      KONG_SSL_PROTOCOLS: 'TLSv1.2 TLSv1.3'
      KONG_CLIENT_SSL: 'on'
      KONG_CLIENT_SSL_CERT: /run/tls/client.pem
      KONG_CLIENT_SSL_CERT_KEY: /run/tls/client.key
      KONG_NGINX_PROXY_PROXY_SSL_TRUSTED_CERTIFICATE: /run/tls/server-ca.pem
      KONG_NGINX_PROXY_PROXY_SSL_VERIFY: 'on'
      KONG_NGINX_PROXY_PROXY_SSL_VERIFY_DEPTH: '2'
    ports:
      - '127.0.0.1:8443:8443'
    volumes:
      - ../gateway/kong.yml:/opt/kong/kong.yml:ro
      - ${PKI_DIR:-./certs}/kong:/run/tls:ro
    networks: [edge, api_transport]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, kong, health]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  loki:
    image: grafana/loki:2.9.17@sha256:c4a25af6f2709fa625d88ee5df494a332a85f30e9575854031667823ecc5be04
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ../monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    networks: [observability]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://localhost:3100/ready]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    logging: *logging

  promtail:
    image: grafana/promtail:2.9.8
    command: -config.file=/etc/promtail/promtail-config.yml -config.expand-env=true
    environment:
      LOG_PROJECT: ${COMPOSE_PROJECT_NAME}
    volumes:
      - ../monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - ${DOCKER_LOG_ROOT:-/var/lib/docker/containers}:/var/log/docker:ro
      - promtail_positions:/positions
    networks: [observability]
    depends_on:
      loki:
        condition: service_healthy
    logging: *logging

  grafana:
    image: grafana/grafana:10.4.19@sha256:a9043254ba16fb10945cc27333963dfd08eccbb43b51f1222d831cc564e3a1f4
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
    secrets: [grafana_admin_password]
    ports:
      - '127.0.0.1:3001:3000'
    volumes:
      - grafana_data:/var/lib/grafana
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks: [observability]
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://localhost:3000/api/health]
      interval: 10s
      timeout: 5s
      retries: 20
    logging: *logging

networks:
  edge: {}
  # Standard bridge preserves DNS used by the current SSRF validator.
  # This permits outbound egress; it is not an egress firewall.
  api_transport: {}
  app_data:
    internal: true
  identity_transport: {}
  identity_data:
    internal: true
  observability:
    internal: true

secrets:
  postgres_password:
    file: ${SECRETS_DIR:-./.secrets}/postgres_password
  migration_password:
    file: ${SECRETS_DIR:-./.secrets}/migration_password
  runtime_password:
    file: ${SECRETS_DIR:-./.secrets}/runtime_password
  jwt_secret:
    file: ${SECRETS_DIR:-./.secrets}/jwt_secret
  webhook_secret:
    file: ${SECRETS_DIR:-./.secrets}/webhook_secret
  identity_admin_password:
    file: ${SECRETS_DIR:-./.secrets}/identity_admin_password
  identity_db_password:
    file: ${SECRETS_DIR:-./.secrets}/identity_db_password
  keycloak_admin_password:
    file: ${SECRETS_DIR:-./.secrets}/keycloak_admin_password
  grafana_admin_password:
    file: ${SECRETS_DIR:-./.secrets}/grafana_admin_password

volumes:
  postgres_data:
  identity_postgres_data:
  loki_data:
  grafana_data:
  promtail_positions:
