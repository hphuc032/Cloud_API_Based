server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate /run/tls/server.pem;
    ssl_certificate_key /run/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    location ~ ^/(realms/florasecure/|resources/) {
        # Preserve the pre-1.29.7 proxy defaults across the image update.
        proxy_http_version 1.0;
        proxy_set_header Connection close;
        proxy_pass https://keycloak:8443;
        proxy_set_header Host $host;
        proxy_ssl_server_name on;
        proxy_ssl_name keycloak;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /run/tls/identity-ca.pem;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
    }
    location / { return 404; }
}
# Loopback-only readiness; never published through the HTTPS virtual server.
server {
    listen 127.0.0.1:8081;
    location = /ready {
        # Preserve the pre-1.29.7 proxy defaults across the image update.
        proxy_http_version 1.0;
        proxy_set_header Connection close;
        proxy_pass https://keycloak:9000/health/ready;
        proxy_ssl_server_name on;
        proxy_ssl_name keycloak;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /run/tls/identity-ca.pem;
    }
    location / { return 404; }
}
