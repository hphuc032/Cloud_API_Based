# Apply after P4. Existing Kong HTTPS/upstream mTLS settings are inherited intact.
services:
  backend:
    environment:
      AUTH_MODE: oidc
      DEBUG: 'false'
      WEBHOOK_PROVIDER: ${WEBHOOK_PROVIDER:-florasecure-simulator}
      WEBHOOK_TIMESTAMP_TOLERANCE: ${WEBHOOK_TIMESTAMP_TOLERANCE:-300}
      WEBHOOK_MAX_BODY_BYTES: '65536'
  kong-keys:
    environment:
      GATEWAY_POLICY: p5
  kong:
    environment:
      KONG_TRUSTED_IPS: ''
      KONG_REAL_IP_RECURSIVE: 'off'
      KONG_NGINX_HTTP_LUA_SHARED_DICT: 'p5_rate_limits 10m'
  keycloak:
    volumes:
      - ./keycloak/florasecure-p5-realm.json:/opt/keycloak/data/import/florasecure-realm.json:ro
  frontend:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    networks: [edge]
    ports: ['127.0.0.1:5174:8443']
    volumes:
      - ${SPA_DIST_DIR:?Build reviewed SPA artifacts}:/usr/share/nginx/html:ro
      - ${SPA_TLS_DIR:?Dedicated SPA leaf and public edge CA}:/run/tls:ro
      - ${SPA_NGINX_CONFIG:?Rendered exact-issuer security config}:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      kong:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, --spider, --quiet, --ca-certificate=/run/tls/edge-ca.pem, 'https://localhost:8443/login']
      interval: 5s
      timeout: 3s
      retries: 20
