server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate /certs/gateway.crt;
    ssl_certificate_key /certs/gateway.key;

    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass https://api:8443;

        proxy_ssl_certificate /certs/gateway.crt;
        proxy_ssl_certificate_key /certs/gateway.key;

        proxy_ssl_trusted_certificate /certs/ca.crt;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_server_name on;
        proxy_ssl_name api;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}