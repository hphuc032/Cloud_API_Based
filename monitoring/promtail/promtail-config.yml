server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /positions/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    static_configs:
      - targets: [localhost]
        labels:
          job: docker
          __path__: /var/log/docker/*/*-json.log
    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            timestamp: time
            service: 'attrs."com.docker.compose.service"'
            project: 'attrs."com.docker.compose.project"'
      - labels:
          stream:
          service:
          project:
      - match:
          selector: '{project!="${LOG_PROJECT}"}'
          action: drop
      - timestamp:
          source: timestamp
          format: RFC3339Nano
      - output:
          source: output
