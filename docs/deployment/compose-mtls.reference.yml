# HISTORICAL pre-P1/P2 lab example; NOT an overlay or deployable P2 alternative.
# Conflicts with current network/DB privileges and uses Nginx instead of Kong.
# Use docker/docker-compose.yml and docs/deployment/p2-tls.md instead.
version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_db_password}
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8443"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-change_this_db_password}@db:5432/appdb
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./certs:/certs:ro
    command: >
      uvicorn main:app
      --host 0.0.0.0
      --port 8443
      --ssl-keyfile /certs/api.key
      --ssl-certfile /certs/api.crt
      --ssl-ca-certs /certs/ca.crt
      --ssl-cert-reqs 2
      --reload

  gateway:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8443:443"
    depends_on:
      - api
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/certs:ro

volumes:
  postgres_data:
